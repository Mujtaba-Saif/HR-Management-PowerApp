srcAttendance As screen:
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)

    screenContainer As groupContainer.verticalAutoLayoutContainer:
        BorderStyle: =BorderStyle.None
        DropShadow: =DropShadow.Light
        Fill: =RGBA(245, 245, 245, 1)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =20
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =16
        PaddingLeft: =16
        PaddingRight: =16
        PaddingTop: =16
        Width: =Parent.Width
        ZIndex: =1

        HeaderSeContainer As groupContainer.verticalAutoLayoutContainer:
            DropShadow: =DropShadow.Light
            Fill: =RGBA(238, 239, 234, 1)
            FillPortions: =0
            Height: =150
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            ZIndex: =1

            HeaderContaine2 As groupContainer.horizontalAutoLayoutContainer:
                BorderStyle: =BorderStyle.None
                Fill: =varPrimary
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =5
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LayoutMode: =LayoutMode.Auto
                PaddingLeft: =8
                PaddingRight: =8
                ZIndex: =1

                Icon1 As icon.Home:
                    AccessibleLabel: ="Go To Home Screen"
                    BorderColor: =RGBA(0, 0, 0, 0)
                    BorderStyle: =BorderStyle.None
                    Color: =Color.White
                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                    DisabledColor: =RGBA(225, 223, 221, 1)
                    DisabledFill: =RGBA(0, 0, 0, 0)
                    FocusedBorderThickness: =1
                    Height: =Parent.Height
                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                    HoverColor: =varPrimaryHover
                    HoverFill: =RGBA(0, 0, 0, 0)
                    Icon: =Icon.Home
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    OnSelect: =Navigate(srcHome,ScreenTransition.Fade)
                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                    PressedColor: =RGBA(16, 110, 190, 1)
                    PressedFill: =RGBA(0, 0, 0, 0)
                    TabIndex: =0
                    ZIndex: =1

                Label1 As label:
                    Align: =Align.Center
                    BorderColor: =RGBA(0, 0, 0, 0)
                    BorderStyle: =BorderStyle.None
                    Color: =Color.White
                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    FillPortions: =1
                    Font: =Font.'Segoe UI'
                    Height: =Parent.Height
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    Size: =18
                    Text: ="Employees Attendance"
                    ZIndex: =2

                ButtonCanvas1_2 As Button:
                    AcceptsFocus: =true
                    AccessibleLabel: =""
                    Align: =Align.Center
                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                    BasePaletteColor: =
                    BorderColor: =
                    BorderStyle: =BorderStyle.None
                    ContentLanguage: =""
                    DisplayMode: =DisplayMode.Edit
                    Font: =""
                    FontColor: =RGBA(255, 255, 255, 1)
                    FontItalic: =false
                    FontSize: =0
                    FontStrikethrough: =false
                    FontUnderline: =false
                    FontWeight: =FontWeight.Lighter
                    Height: =75
                    Icon: ="Dismiss"
                    IconRotation: =0
                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                    Layout: ='ButtonCanvas.Layout'.IconOnly
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =32
                    LayoutMinWidth: =96
                    OnSelect: =Exit()
                    TabIndex: =0
                    Text: ="Button"
                    Tooltip: =""
                    VerticalAlign: =""
                    Visible: =true
                    Width: |-
                        =If(
                            App.Width < 400,
                            60,
                            100
                        )
                    X: =Parent.Width-Self.Width
                    Y: =0
                    ZIndex: =3

            SearchContainer2 As groupContainer.horizontalAutoLayoutContainer:
                BorderStyle: =BorderStyle.None
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =10
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LayoutMode: =LayoutMode.Auto
                PaddingBottom: =8
                PaddingLeft: =8
                PaddingRight: =8
                PaddingTop: =8
                ZIndex: =2

                Icon2 As icon.Search:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =varPrimary
                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                    DisabledColor: =RGBA(225, 223, 221, 1)
                    DisabledFill: =RGBA(0, 0, 0, 0)
                    FocusedBorderThickness: =0
                    Height: =Parent.Height
                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                    HoverColor: =RGBA(16, 110, 190, 1)
                    HoverFill: =RGBA(0, 0, 0, 0)
                    Icon: =Icon.Search
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                    PressedColor: =RGBA(16, 110, 190, 1)
                    PressedFill: =RGBA(0, 0, 0, 0)
                    ZIndex: =1

                TextInput1 As text:
                    AccessibleLabel: ="Input"
                    BorderColor: =RGBA(245, 245, 245, 1)
                    BorderThickness: =2
                    Clear: |
                        =true
                    Color: =Color.Black
                    Default: =
                    DelayOutput: |
                        =true
                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    DisabledFill: =RGBA(242, 242, 241, 0)
                    FillPortions: =1
                    FocusedBorderThickness: =4
                    Font: =Font.'Segoe UI'
                    Height: =Parent.Height*0.5
                    HintText: ="Search Employees..."
                    HoverBorderColor: =RGBA(16, 110, 190, 1)
                    HoverColor: =RGBA(50, 49, 48, 1)
                    HoverFill: =RGBA(255, 255, 255, 1)
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    PressedBorderColor: =RGBA(0, 120, 212, 1)
                    PressedColor: =RGBA(50, 49, 48, 1)
                    PressedFill: =RGBA(255, 255, 255, 1)
                    RadiusBottomLeft: =8
                    RadiusBottomRight: =8
                    RadiusTopLeft: =8
                    RadiusTopRight: =8
                    Reset: =true
                    Size: =18
                    ZIndex: =2

        MainContainer3 As groupContainer.horizontalAutoLayoutContainer:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.Light
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            ZIndex: =2

            "Gallery1 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
                AccessibleLabel: ="Employees Attendance"
                BorderColor: =RGBA(245, 245, 245, 1)
                DelayItemLoading: =true
                Fill: =RGBA(255, 255, 255, 1)
                Items: |
                    =If(
                        IsBlank(TextInput1.Text),
                        'Employees Attendance',
                        Filter(
                            'Employees Attendance',
                            StartsWith(Name.Value,TextInput1.Text) 
                        )
                    )
                Layout: =Layout.Vertical
                LayoutMaxHeight: =
                LayoutMaxWidth: =Parent.Width
                LayoutMinHeight: =16
                LayoutMinWidth: =20
                LoadingSpinner: =LoadingSpinner.Data
                TemplateSize: =75
                Width: =500
                ZIndex: =1

                Title1 As label:
                    Color: =Color.Black
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    Font: =Font.'Segoe UI'
                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =12
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =18
                    Text: =ThisItem.Name.Value
                    Width: =400
                    X: |-
                        =If(
                            App.Width < 600,
                            0,
                            30
                        )
                    Y: =18
                    ZIndex: =2

                Subtitle1 As label:
                    Color: =Color.Black
                    DisabledColor: =RGBA(161, 159, 157, 1)
                    Font: =Font.'Segoe UI'
                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =12
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =16
                    Text: =ThisItem.Status.Value
                    Width: =200
                    X: =Parent.Width*0.6
                    Y: =18
                    ZIndex: =3

                Separator1 As rectangle:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =8
                    OnSelect: =Select(Parent)
                    Width: =Parent.TemplateWidth
                    Y: =Parent.TemplateHeight - Self.Height
                    ZIndex: =5

                Rectangle1 As rectangle:
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Fill: =RGBA(0, 120, 212, 1)
                    Height: =Parent.TemplateHeight - Separator1.Height
                    OnSelect: =Select(Parent)
                    Visible: =ThisItem.IsSelected
                    Width: =4
                    ZIndex: =6

